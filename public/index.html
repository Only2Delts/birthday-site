<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Your Name</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="container pop-in">
        <div class="emoji-float">🎉</div>
        <h1 class="gradient-text">Enter Your Name</h1>
        <form id="nameForm">
            <input type="text" id="nameInput" placeholder="Your name" required autocomplete="off">
            <button type="submit" class="btn-primary">Let's Go 🚀</button>
        </form>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
